<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNQ / MES Trading Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gray: { 750: '#2d3748', 850: '#1f2937', 950: '#0b0f19' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050507;
      color: #f1f5f9;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      letter-spacing: -0.01em;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f1117;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .glass {
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .card-glow {
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), 0 4px 20px -4px rgba(0, 0, 0, 0.5);
    }

    .stat-glow-green {
      box-shadow: 0 0 24px -8px rgba(34, 197, 94, 0.25);
    }

    .stat-glow-red {
      box-shadow: 0 0 24px -8px rgba(239, 68, 68, 0.25);
    }

    .stat-glow-blue {
      box-shadow: 0 0 24px -8px rgba(59, 130, 246, 0.25);
    }

    .stat-glow-amber {
      box-shadow: 0 0 24px -8px rgba(245, 158, 11, 0.25);
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <script>
    // ==================== CONSTANTS & HELPERS ====================
    const { useState, useEffect, useMemo } = React;
    const e = React.createElement;

    const STORAGE_KEY = 'tradingJournal_v1';
    const INSTRUMENTS = ['MNQ', 'MES'];
    const DIRECTIONS = ['Long', 'Short'];
    const SESSIONS = ['NY open', 'NY lunch', 'Outside session'];
    const OUTCOMES = ['Win', 'Loss', 'Breakeven', 'Stopped early', 'Target hit'];
    const PRIMARY_SETUPS = ['Order Block (OB)', 'Fair Value Gap (FVG)', 'Liquidity sweep', 'Breaker Block', 'Market Structure Shift (MSS/BOS)', 'OTE retracement', 'Power of 3 (AMD)', 'ATH Strategy'];
    const HTF_BIASES = ['Bullish', 'Bearish', 'Neutral/ranging'];
    const HTF_TIMEFRAMES = ['1H', '4H', 'Daily'];
    const ENTRY_MODELS = ['OB retest', 'FVG fill', 'Sweep + reverse', 'BOS + pullback', 'OTE zone', 'AMD accumulation'];
    const EMOTIONAL_STATES = ['Calm', 'Impatient', 'Fearful', 'Overconfident', 'Neutral'];
    const WAITED_OPTIONS = ['Yes', 'No', 'Partially'];
    const MOVED_STOP_OPTIONS = ['Yes — widened', 'Yes — tightened', 'No'];
    const EXITED_EARLY_OPTIONS = ['Yes', 'No'];
    const EXITED_EARLY_WHY = ['Felt scared', 'Took partials', 'News', 'Other'];

    const ROUTINES_KEY = 'tradingJournalRoutines_v1';

    const CHECKLIST_DEF = [
      { k: 'htfBiasConfirmed', l: 'HTF bias confirmed (1H or higher)' },
      { k: 'sessionActive', l: 'Session killzone active (NY open or NY lunch)' },
      { k: 'validSetup', l: 'Valid ICT setup present (OB, FVG, or sweep)' },
      { k: 'entry5mConfirmation', l: 'Entry on 1 or 2 Min FVG' },
      { k: 'stopBeyondStructure', l: 'Stop placed beyond structure (OB low/high or swing)' },
      { k: 'riskInRange', l: 'Risk is max $200' }
    ];

    const TICK_SIZE = 0.25;

    function pad2(n) { return String(n).padStart(2, '0'); }
    function nowLocal() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
    function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    function fmt$(n) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n); }

    function getSessionFromTime(date = new Date()) {
      const h = date.getHours(), m = date.getMinutes(), t = h + m / 60;
      if (t >= 9.5 && t < 11) return 'NY open';
      if (t >= 13 && t < 15) return 'NY lunch';
      return 'Outside session';
    }

    function calcMetrics(t) {
      const tv = t.instrument === 'MNQ' ? 0.50 : 1.25;
      
      let entries = t.entries;
      if (!entries || !entries.length) {
        if (t.entryPrice !== '' && t.entryPrice != null) {
          entries = [{ price: t.entryPrice, contracts: t.contracts || 1 }];
        } else {
          entries = [];
        }
      }
      
      let totalEntryContracts = 0;
      let sumEntryPriceTimesContracts = 0;
      entries.forEach(en => {
        if (en.price !== '' && en.price != null && en.contracts > 0) {
          const p = parseFloat(en.price);
          const c = parseFloat(en.contracts);
          sumEntryPriceTimesContracts += p * c;
          totalEntryContracts += c;
        }
      });
      const avgEntryPrice = totalEntryContracts > 0 ? (sumEntryPriceTimesContracts / totalEntryContracts) : t.entryPrice;

      const rt = Math.round(Math.abs(avgEntryPrice - t.stopPrice) / TICK_SIZE);
      const rwt = Math.round(Math.abs(t.targetPrice - avgEntryPrice) / TICK_SIZE);
      const rr = rt > 0 ? Math.round((rwt / rt) * 100) / 100 : 0;

      let riskContracts = t.contracts || 1;
      if (totalEntryContracts > 0) riskContracts = totalEntryContracts;

      const risk$ = Math.round(rt * tv * riskContracts * 100) / 100;

      let exits = t.exits;
      if (!exits || !exits.length) {
        if (t.exitPrice !== '' && t.exitPrice != null) {
          exits = [{ price: t.exitPrice, contracts: t.contracts || 1 }];
        } else {
          exits = [];
        }
      }

      let pnl = 0;
      let totalExitContracts = 0;
      let sumExitPriceTimesContracts = 0;

      exits.forEach(ex => {
        if (ex.price !== '' && ex.price != null && ex.contracts > 0) {
          const p = parseFloat(ex.price);
          const c = parseFloat(ex.contracts);
          let pnlTicks = t.direction === 'Long' ? (p - avgEntryPrice) / TICK_SIZE : (avgEntryPrice - p) / TICK_SIZE;
          pnl += pnlTicks * tv * c;
          sumExitPriceTimesContracts += p * c;
          totalExitContracts += c;
        }
      });

      pnl = Math.round(pnl * 100) / 100;
      const avgExitPrice = totalExitContracts > 0 ? Math.round((sumExitPriceTimesContracts / totalExitContracts) / TICK_SIZE) * TICK_SIZE : t.exitPrice;

      return { rt, rwt, rr, pnl, risk$, avgExitPrice, avgEntryPrice, totalEntryContracts, totalExitContracts, numExits: exits.length };
    }

    function calcAdherence(t) {
      if (t.psychology?.setupPlanLevel === 'Gamble') return 0;
      const entries = Object.entries(t.checklist).filter(([, v]) => v !== 'Skipped');
      if (!entries.length) return 0;
      const successCount = entries.filter(([k, v]) => v === 'Yes').length;
      return Math.round((successCount / entries.length) * 100);
    }

    function calcRoutineScore(r) {
      if (!r) return 0;
      const dCount = ['meditation', 'workout', 'tradeJournal'].filter(k => r.discipline && r.discipline[k]).length;
      const dp = (dCount / 3) * 100;
      const pCount = ['meditation5min', 'htfAnalysis', 'markLevels', 'tradePlan', 'newsCheck'].filter(k => r.preMarket && r.preMarket[k]).length;
      const pp = (pCount + (r.preMarket && r.preMarket.stateOfMind ? 1 : 0) + (r.preMarket && (r.preMarket.preMarketNotes || r.preMarket.journalState) ? 1 : 0)) / 7 * 100;
      return Math.round((dp + pp) / 2);
    }

    function emptyChecklist() { const c = {}; CHECKLIST_DEF.forEach(x => c[x.k] = 'No'); return c; }

    function emptyTrade() {
      const now = nowLocal();
      return {
        id: '', date: now, instrument: 'MNQ', direction: 'Long', session: getSessionFromTime(),
        entries: [{ time: '', price: '', contracts: 1 }],
        entryPrice: '', stopPrice: '', targetPrice: '', exitPrice: '', contracts: 1,
        exits: [{ time: '', price: '', contracts: 1 }],
        outcome: 'Win',
        setup: { primary: [], htfBias: 'Bullish', htfTimeframe: '1H', entryModel: 'OB retest', confluentLiquidity: false, tookLiquidityBeforeEntry: false },
        checklist: emptyChecklist(),
        executionReview: {},
        psychology: { setupPlanLevel: 'A++', waitedForSetup: 'Yes', movedStop: 'No', exitedEarly: 'No', exitedEarlyWhy: '', whatDidIRight: '', whatDidIWrong: '' },
        screenshots: { htf: null, ltf: null }
      };
    }

    function emptyRoutine() {
      return {
        discipline: { meditation: false, workout: false, tradeJournal: false, tradeJournalNotes: '' },
        preMarket: { meditation5min: false, htfAnalysis: false, markLevels: false, tradePlan: false, newsCheck: false, stateOfMind: '', preMarketNotes: '' },
        postMarket: { whatDidIRight: '', whatDidIWrong: '' }
      };
    }

    function suggestOutcome(t) {
      const { direction, stopPrice, targetPrice } = t;
      const m = calcMetrics(t);
      if (!m || m.numExits === 0) return 'Win';
      const entryPrice = m.avgEntryPrice;
      const exitPrice = m.avgExitPrice;
      if (direction === 'Long') {
        if (exitPrice >= targetPrice - TICK_SIZE / 2) return 'Target hit';
        if (exitPrice <= stopPrice + TICK_SIZE / 2) return 'Loss';
        if (Math.abs(exitPrice - entryPrice) < TICK_SIZE) return 'Breakeven';
        if (exitPrice > entryPrice) return 'Win';
        return 'Stopped early';
      } else {
        if (exitPrice <= targetPrice + TICK_SIZE / 2) return 'Target hit';
        if (exitPrice >= stopPrice - TICK_SIZE / 2) return 'Loss';
        if (Math.abs(exitPrice - entryPrice) < TICK_SIZE) return 'Breakeven';
        if (exitPrice < entryPrice) return 'Win';
        return 'Stopped early';
      }
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1200;
          const MAX_HEIGHT = 1200;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.6));
        };
      };
    }

    function ZoomableImageModal({ src, onClose }) {
      const [scale, setScale] = useState(1);
      const [isDragging, setIsDragging] = useState(false);
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

      useEffect(() => {
        const handleWheel = e => {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            setScale(s => Math.min(Math.max(0.5, s - e.deltaY * 0.01), 5));
          }
        };
        const handleKeyDown = e => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('wheel', handleWheel, { passive: false });
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('wheel', handleWheel);
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [onClose]);

      const handleMouseDown = e => {
        setIsDragging(true);
        setDragStart({ x: e.clientX - pos.x, y: e.clientY - pos.y });
      };
      
      const handleMouseMove = e => {
        if (!isDragging) return;
        setPos({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
      };

      return e('div', { 
        className: 'fixed inset-0 z-[9999] bg-black/95 flex items-center justify-center overflow-hidden', 
        onMouseUp: () => setIsDragging(false), 
        onMouseLeave: () => setIsDragging(false), 
        onMouseMove: handleMouseMove,
        onClick: e => e.stopPropagation()
      },
        e('button', { onClick: onClose, className: 'absolute top-6 right-6 z-10 p-2.5 bg-white/10 hover:bg-white/20 rounded-full text-white transition backdrop-blur-sm' },
          e('svg', { xmlns: 'http://www.w3.org/2000/svg', className: 'h-6 w-6', fill: 'none', viewBox: '0 0 24 24', stroke: 'currentColor' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M6 18L18 6M6 6l12 12' }))
        ),
        e('div', { className: 'absolute top-6 left-6 z-10 text-white/50 text-xs font-mono bg-black/50 px-3 py-1.5 rounded backdrop-blur-sm' }, 'Hold Ctrl + Scroll to Zoom • Drag to Pan'),
        e('div', { className: 'flex gap-2 absolute bottom-6 z-10 bg-black/50 p-2 rounded-lg backdrop-blur-sm shadow-xl' },
          e('button', { onClick: () => setScale(s => Math.max(0.5, s - 0.2)), className: 'p-2 bg-white/10 hover:bg-white/20 rounded text-white text-xs font-bold' }, 'Zoom Out'),
          e('button', { onClick: () => { setScale(1); setPos({x:0,y:0}); }, className: 'p-2 bg-white/10 hover:bg-white/20 rounded text-white text-xs font-bold' }, 'Reset'),
          e('button', { onClick: () => setScale(s => Math.min(5, s + 0.2)), className: 'p-2 bg-white/10 hover:bg-white/20 rounded text-white text-xs font-bold' }, 'Zoom In')
        ),
        e('img', { 
          src, 
          onMouseDown: handleMouseDown,
          className: 'max-w-none object-contain cursor-move transition-transform duration-75 select-none',
          style: { transform: `translate(${pos.x}px, ${pos.y}px) scale(${scale})`, maxHeight: '90vh', maxWidth: '90vw' },
          draggable: false
        })
      );
    }

    // ==================== CHART COMPONENTS ====================
    function Card({ children, className = '' }) {
      return e('div', { className: `bg-[#0f1117] rounded-xl border border-white/[0.04] p-5 card-glow ${className}` }, children);
    }

    function StatCard({ label, value, sub, color }) {
      const c = color === 'green' ? 'text-emerald-400' : color === 'red' ? 'text-rose-400' : color === 'amber' ? 'text-amber-400' : 'text-blue-400';
      const glow = color === 'green' ? 'stat-glow-green' : color === 'red' ? 'stat-glow-red' : color === 'amber' ? 'stat-glow-amber' : 'stat-glow-blue';
      return e('div', { className: `bg-[#0f1117] rounded-xl border border-white/[0.04] p-5 flex flex-col justify-between min-h-[100px] ${glow}` },
        e('span', { className: 'text-[10px] font-semibold uppercase tracking-[0.08em] text-gray-500 mb-2' }, label),
        e('span', { className: `text-3xl font-extrabold tracking-tight ${c}` }, value),
        sub ? e('span', { className: 'text-[11px] text-gray-400 mt-1 font-medium' }, sub) : null
      );
    }

    function SimpleBarChart({ data, title, colorFn }) {
      if (!data || !data.length) return e(Card, null, e('h3', { className: 'text-sm font-semibold text-gray-300 mb-2' }, title), e('p', { className: 'text-xs text-gray-500' }, 'No data yet.'));
      const max = Math.max(...data.map(d => Math.abs(d.value)), 0.01);
      const h = 180, bw = 28, gap = 16;
      const w = Math.max(320, data.length * (bw + gap) + gap);
      return e(Card, null,
        e('h3', { className: 'text-sm font-semibold text-gray-300 mb-3' }, title),
        e('svg', { viewBox: `0 0 ${w} ${h + 40}`, className: 'w-full' },
          e('line', { x1: 0, y1: h / 2, x2: w, y2: h / 2, stroke: '#334155', strokeWidth: 1 }),
          data.map((d, i) => {
            const x = gap + i * (bw + gap);
            const bh = (Math.abs(d.value) / max) * (h / 2 - 10);
            const y = d.value >= 0 ? h / 2 - bh : h / 2;
            const col = colorFn ? colorFn(d.value, d.rawValue !== undefined ? d.rawValue : d.value) : '#3b82f6';
            return e('g', { key: i },
              e('rect', { x, y, width: bw, height: bh, fill: col, rx: 2 }),
              e('text', { x: x + bw / 2, y: d.value >= 0 ? y - 5 : y + bh + 12, textAnchor: 'middle', fill: '#cbd5e1', fontSize: 10 }, String(d.value)),
              e('text', { x: x + bw / 2, y: h + 18, textAnchor: 'middle', fill: '#94a3b8', fontSize: 10 }, d.label)
            );
          })
        )
      );
    }

    function SetupWinRateGrid({ data, title }) {
      if (!data || !data.length) return e(Card, null, e('h3', { className: 'text-sm font-semibold text-gray-300 mb-2' }, title), e('p', { className: 'text-xs text-gray-500' }, 'No data yet.'));
      
      return e(Card, { className: 'flex flex-col' },
        e('h3', { className: 'text-sm font-semibold text-gray-300 mb-6' }, title),
        e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 gap-4 max-h-[300px] overflow-y-auto pr-2' },
          data.map((d, i) => {
            const pct = d.value;
            let color = '#3b82f6'; // blue
            let shadow = 'drop-shadow-[0_0_8px_rgba(59,130,246,0.6)]';
            if (pct >= 60) {
              color = '#10b981'; // emerald
              shadow = 'drop-shadow-[0_0_8px_rgba(16,185,129,0.6)]';
            } else if (pct < 40) {
              color = '#f43f5e'; // rose
              shadow = 'drop-shadow-[0_0_8px_rgba(244,63,94,0.6)]';
            } else {
              color = '#f59e0b'; // amber
              shadow = 'drop-shadow-[0_0_8px_rgba(245,158,11,0.6)]';
            }

            const radius = 34;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - (pct / 100) * circumference;

            return e('div', { key: i, className: 'flex flex-col items-center p-4 bg-white/[0.02] rounded-xl border border-white/[0.04] hover:bg-white/[0.06] hover:border-white/[0.1] transition group' },
              e('div', { className: 'relative w-20 h-20 flex items-center justify-center mb-3' },
                e('svg', { className: 'w-full h-full transform -rotate-90', viewBox: '0 0 100 100' },
                  e('circle', { cx: 50, cy: 50, r: radius, fill: 'transparent', stroke: '#1f2937', strokeWidth: 8 }),
                  e('circle', { 
                    cx: 50, cy: 50, r: radius, fill: 'transparent', stroke: color, strokeWidth: 8, 
                    strokeDasharray: circumference, strokeDashoffset, strokeLinecap: 'round',
                    className: `transition-all duration-1000 ease-out ${shadow}`
                  })
                ),
                e('div', { className: 'absolute inset-0 flex items-center justify-center flex-col group-hover:scale-110 transition-transform' },
                  e('span', { className: 'text-[15px] font-extrabold', style: { color } }, `${pct}%`)
                )
              ),
              e('span', { className: 'text-[10px] font-bold text-gray-400 uppercase tracking-wider text-center line-clamp-2 h-7 leading-tight group-hover:text-gray-200 transition-colors', title: d.label }, d.label)
            );
          })
        )
      );
    }

    function TimeProfitabilityChart({ hourlyData, dailyData, setupData }) {
      const [view, setView] = useState('setup');
      const data = view === 'hour' ? hourlyData : view === 'day' ? dailyData : setupData;

      if (view === 'setup') {
        const maxVal = 100;
        return e(Card, { className: 'flex flex-col h-full' },
          e('div', { className: 'flex justify-between items-center mb-4' },
            e('h3', { className: 'text-sm font-semibold text-gray-300' }, 'Win Rate by Setup'),
            e('div', { className: 'flex bg-black/40 rounded-lg p-1 border border-white/[0.04]' },
              e('button', { onClick: () => setView('setup'), className: `px-4 py-1.5 rounded-md text-xs font-bold transition-all ${view === 'setup' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:text-gray-300'}` }, 'By Setup'),
              e('button', { onClick: () => setView('hour'), className: `px-4 py-1.5 rounded-md text-xs font-bold transition-all ${view === 'hour' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:text-gray-300'}` }, 'By Hour'),
              e('button', { onClick: () => setView('day'), className: `px-4 py-1.5 rounded-md text-xs font-bold transition-all ${view === 'day' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:text-gray-300'}` }, 'By Day')
            )
          ),
          e('div', { className: 'flex-1 flex items-end justify-between gap-2 h-48 pb-8 relative' },
            e('div', { className: 'absolute inset-x-0 bottom-8 border-b border-white/[0.04]' }),
            !data.length ? e('div', { className: 'w-full text-center text-xs text-gray-500 py-10' }, 'No data yet.') :
            data.map((d, i) => {
              const hPct = Math.max((d.value / maxVal) * 100, 2);
              const isPos = d.value >= 50;
              const color = d.value >= 60 ? 'from-emerald-500 to-teal-400' : d.value >= 40 ? 'from-amber-500 to-yellow-400' : 'from-rose-500 to-red-400';
              const textCol = d.value >= 60 ? 'text-emerald-400' : d.value >= 40 ? 'text-amber-400' : 'text-rose-400';
              return e('div', { key: i, className: 'flex flex-col items-center justify-end h-full w-full group relative z-10', title: `${d.label}: ${d.value}%` },
                e('span', { className: `absolute -top-7 text-[10px] font-bold opacity-80 group-hover:opacity-100 ${textCol}` }, `${d.value}%`),
                e('div', { className: `w-full max-w-[3rem] bg-gradient-to-t ${color} rounded-t-sm transition-all`, style: { height: `${hPct}%` } }),
                e('div', { className: 'absolute -bottom-7 text-[9px] font-bold text-gray-500 uppercase tracking-widest whitespace-nowrap max-w-[4rem] overflow-hidden text-ellipsis', title: d.label }, d.label)
              );
            })
          )
        );
      }

      // Bar Graph for Hourly and Daily profitability
      const maxVal = Math.max(...data.map(d => Math.abs(d.value)), 100);
      const roundedMax = Math.ceil(maxVal / 100) * 100;
      const h = 180, padding = { top: 20, right: 20, bottom: 40, left: 50 };
      const chartW = Math.max(300, data.length * 50);
      const innerW = chartW - padding.left - padding.right;
      const innerH = h - padding.top - padding.bottom;
      const barW = Math.min(40, (innerW / data.length) - 8);
      const gap = (innerW - barW * data.length) / (data.length + 1);

      const toY = v => padding.top + (roundedMax - v) / (roundedMax * 2) * innerH + innerH / 2;
      const zeroY = toY(0);

      const yTicks = [];
      for (let v = 0; v <= roundedMax; v += 100) {
        yTicks.push(v);
      }

      const colorFn = (d) => d.value >= 0 ? '#10b981' : '#f43f5e';

      return e(Card, { className: 'flex flex-col' },
        e('div', { className: 'flex justify-between items-center mb-4' },
          e('h3', { className: 'text-sm font-semibold text-gray-300' }, 'Time-Based Profitability'),
          e('div', { className: 'flex bg-black/40 rounded-lg p-1 border border-white/[0.04]' },

    function ExpectancyStats({ trades }) {
      const stats = useMemo(() => {
        if (!trades || !trades.length) return null;
        let wins = [], losses = [];
        trades.forEach(t => {
          const m = calcMetrics(t);
          if (m.pnl > 0) wins.push(m.pnl);
          else if (m.pnl < 0) losses.push(Math.abs(m.pnl));
        });
        if (!wins.length && !losses.length) return null;
        const avgWin = wins.length ? wins.reduce((a, b) => a + b, 0) / wins.length : 0;
        const avgLoss = losses.length ? losses.reduce((a, b) => a + b, 0) / losses.length : 0;
        const expectancy = (wins.length * avgWin - losses.length * avgLoss) / (wins.length + losses.length);
        const winRate = wins.length / (wins.length + losses.length);
        return {
          avgWin: Math.round(avgWin * 100) / 100,
          avgLoss: Math.round(avgLoss * 100) / 100,
          expectancy: Math.round(expectancy * 100) / 100,
          avgWinLoss: wins.length && losses.length ? `${(avgWin / avgLoss).toFixed(2)}:1` : 'N/A',
          totalWins: wins.length,
          totalLosses: losses.length,
          winRate: Math.round(winRate * 100)
        };
      }, [trades]);

      if (!stats) return e(Card, null,
        e('h3', { className: 'text-sm font-semibold text-gray-300 mb-2' }, 'Expectancy'),
        e('p', { className: 'text-xs text-gray-500' }, 'Need wins and losses to calculate.')
      );

      return e(Card, { className: 'flex flex-col' },
        e('h3', { className: 'text-sm font-semibold text-gray-300 mb-4' }, 'Expectancy'),
        e('div', { className: 'grid grid-cols-2 gap-3' },
          e('div', { className: 'flex flex-col gap-1 p-3 rounded-lg bg-emerald-500/5 border border-emerald-500/20' },
            e('span', { className: 'text-[10px] text-gray-500 uppercase tracking-wider' }, 'Avg Win'),
            e('span', { className: 'text-lg font-bold text-emerald-400' }, fmt$(stats.avgWin))
          ),
          e('div', { className: 'flex flex-col gap-1 p-3 rounded-lg bg-rose-500/5 border border-rose-500/20' },
            e('span', { className: 'text-[10px] text-gray-500 uppercase tracking-wider' }, 'Avg Loss'),
            e('span', { className: 'text-lg font-bold text-rose-400' }, fmt$(stats.avgLoss))
          ),
          e('div', { className: 'flex flex-col gap-1 p-3 rounded-lg bg-blue-500/5 border border-blue-500/20' },
            e('span', { className: 'text-[10px] text-gray-500 uppercase tracking-wider' }, 'Expectancy'),
            e('span', { className: `text-lg font-bold ${stats.expectancy >= 0 ? 'text-blue-400' : 'text-rose-400'}` }, fmt$(stats.expectancy))
          ),
          e('div', { className: 'flex flex-col gap-1 p-3 rounded-lg bg-amber-500/5 border border-amber-500/20' },
            e('span', { className: 'text-[10px] text-gray-500 uppercase tracking-wider' }, 'Avg W:L'),
            e('span', { className: 'text-lg font-bold text-amber-400' }, stats.avgWinLoss)
          )
        ),
        e('div', { className: 'flex justify-between mt-4 pt-3 border-t border-white/5 text-[10px] text-gray-500' },
          e('span', null, `${stats.totalWins}W / ${stats.totalLosses}L`)
        )
      );
    }

    function MonthlyCalendar({ pnlByDay, onDateClick, discipline }) {
      const [currentDate, setCurrentDate] = useState(() => {
        const d = new Date();
        return new Date(d.getFullYear(), d.getMonth(), 1);
      });
      const [showPercent, setShowPercent] = useState(false);

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthPrefix = `${year}-${pad2(month + 1)}`;

      const handlePrev = () => setCurrentDate(new Date(year, month - 1, 1));
      const handleNext = () => setCurrentDate(new Date(year, month + 1, 1));
      const handleToday = () => {
        const d = new Date();
        setCurrentDate(new Date(d.getFullYear(), d.getMonth(), 1));
      };

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayOfWeek = new Date(year, month, 1).getDay();

      const blanks = Array.from({ length: firstDayOfWeek }).map((_, i) => null);
      const days = Array.from({ length: daysInMonth }).map((_, i) => i + 1);
      const totalCells = [...blanks, ...days];
      while (totalCells.length < 42) totalCells.push(null);

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      const pnlMap = {};
      pnlByDay.forEach(d => pnlMap[d.date] = d.pnl);

      const todayStr = `${new Date().getFullYear()}-${pad2(new Date().getMonth() + 1)}-${pad2(new Date().getDate())}`;

      // Calculate monthly stats
      const monthData = pnlByDay.filter(d => d.date.startsWith(monthPrefix));
      const totalPnL = monthData.reduce((s, d) => s + d.pnl, 0);
      const winDays = monthData.filter(d => d.pnl > 0).length;
      const lossDays = monthData.filter(d => d.pnl < 0).length;
      const breakEvenDays = monthData.filter(d => d.pnl === 0).length;
      const totalDays = monthData.length;
      const winRate = totalDays > 0 ? Math.round((winDays / totalDays) * 100) : 0;

      // Summary Section
      const pnlColorClass = totalPnL > 0 ? 'text-emerald-400' : totalPnL < 0 ? 'text-rose-400' : 'text-gray-400';
      const winRateColorClass = winRate >= 50 ? 'text-emerald-400' : winRate < 40 ? 'text-rose-400' : 'text-amber-400';

      // For % mode display - show meaningful percentages
      const winRateFormatted = showPercent ? `${winRate}% WR` : null;
      const disciplineVal = discipline || 0;
      const disciplineColorClass = disciplineVal >= 80 ? 'text-emerald-400' : disciplineVal >= 60 ? 'text-amber-400' : 'text-rose-400';

      if (showPercent && totalDays > 0) {

        return e(Card, { className: 'flex flex-col' },

              e('div', { className: 'flex items-center bg-black/40 rounded-lg border border-white/[0.04] p-0.5 mr-2' },
                e('button', { onClick: () => setShowPercent(false), className: `px-2 py-1 rounded text-[10px] font-bold transition ${!showPercent ? 'bg-blue-600 text-white' : 'text-gray-500'}` }, '$'),
                e('button', { onClick: () => setShowPercent(true), className: `px-2 py-1 rounded text-[10px] font-bold transition ${showPercent ? 'bg-blue-600 text-white' : 'text-gray-500'}` }, '%')
              ),
              e('div', { className: 'flex items-center gap-1 bg-white/[0.02] border border-white/[0.04] rounded-lg p-1' },
                e('button', { onClick: handlePrev, className: 'p-1 rounded hover:bg-white/[0.05] text-gray-400 hover:text-white transition' }, '◀'),
                e('button', { onClick: handleToday, className: 'px-2 py-1 rounded hover:bg-white/[0.05] text-[9px] uppercase font-bold text-gray-400 hover:text-white transition' }, 'Today'),
                e('button', { onClick: handleNext, className: 'p-1 rounded hover:bg-white/[0.05] text-gray-400 hover:text-white transition' }, '▶')
              )
            )
          ),
          e('div', { className: 'grid grid-cols-2 gap-3 mb-4' },
            e('div', { className: 'text-center p-4 bg-emerald-500/5 border border-emerald-500/20 rounded-lg' },
              e('div', { className: 'text-[9px] uppercase text-emerald-400/70 tracking-wider mb-2' }, 'Win Rate'),
              e('div', { className: `text-3xl font-extrabold ${winRateColorClass}` }, `${winRate}%`)
            ),
            e('div', { className: 'text-center p-4 bg-blue-500/5 border border-blue-500/20 rounded-lg' },
              e('div', { className: 'text-[9px] uppercase text-blue-400/70 tracking-wider mb-2' }, 'Discipline'),
              e('div', { className: `text-3xl font-extrabold ${disciplineColorClass}` }, `${disciplineVal}%`)
            )
          ),
          e('div', { className: 'flex justify-center gap-6 text-xs text-gray-500' },
            e('span', null, e('span', { className: 'text-emerald-400 font-bold' }, `${winDays}W`), ` / `, e('span', { className: 'text-rose-400 font-bold' }, `${lossDays}L`), `${breakEvenDays > 0 ? ` / ${breakEvenDays}BE` : ''}`),
            e('span', null, `${totalDays} days`)
          ),

              const dateStr = `${year}-${pad2(month + 1)}-${pad2(day)}`;
              const pnl = pnlMap[dateStr];
              const hasTrade = pnl !== undefined;

              let pnlColor = 'text-gray-500';
              let bgClass = 'bg-white/[0.02] hover:bg-white/[0.04] border-white/[0.04]';

                  pnlColor = 'text-gray-300';
                  bgClass = 'bg-gray-500/[0.05] border-gray-500/30 hover:bg-gray-500/[0.1]';

    // ---------- Dashboard ----------
    function Dashboard({ trades, onDateClick }) {
      const stats = useMemo(() => {
        if (!trades.length) return null;
        const wins = trades.filter(t => t.outcome === 'Win' || t.outcome === 'Target hit').length;
        let totalPnL = 0, grossProfit = 0, grossLoss = 0;
        let longTrades = 0, longWins = 0, longPnL = 0;
        let shortTrades = 0, shortWins = 0, shortPnL = 0;

        trades.forEach(t => {
          const pnl = calcMetrics(t).pnl;
          totalPnL += pnl;
          if (pnl > 0) grossProfit += pnl;
          if (pnl < 0) grossLoss += Math.abs(pnl);

          const isWin = t.outcome === 'Win' || t.outcome === 'Target hit';
          if (t.direction === 'Long') {
            longTrades++;
            longPnL += pnl;
            if (isWin) longWins++;
          } else {
            shortTrades++;
            shortPnL += pnl;
            if (isWin) shortWins++;
          }
        });

        const profitFactor = grossLoss === 0 ? (grossProfit > 0 ? 99.99 : 0) : Math.round((grossProfit / grossLoss) * 100) / 100;

        const avgRR = trades.reduce((s, t) => s + calcMetrics(t).rr, 0) / trades.length;
        const aPlusCount = trades.filter(t => t.psychology?.setupPlanLevel === 'A++').length;
        const aPlusRate = trades.length ? Math.round((aPlusCount / trades.length) * 100) : 0;
        const avgAdh = trades.reduce((s, t) => s + calcAdherence(t), 0) / trades.length;

        return {
          total: trades.length,
          winRate: Math.round((wins / trades.length) * 100),
          profitFactor,
          avgRR: Math.round(avgRR * 100) / 100,
          totalPnL: Math.round(totalPnL * 100) / 100,
          aPlusRate,
          avgAdh: Math.round(avgAdh),
          longs: { trades: longTrades, winRate: longTrades ? Math.round((longWins / longTrades) * 100) : 0, pnl: Math.round(longPnL * 100) / 100 },
          shorts: { trades: shortTrades, winRate: shortTrades ? Math.round((shortWins / shortTrades) * 100) : 0, pnl: Math.round(shortPnL * 100) / 100 }
        };
      }, [trades]);

      const pnlByDay = useMemo(() => {
        const map = {};
        trades.forEach(t => {
          const day = t.date.slice(0, 10);
          const m = calcMetrics(t);
          map[day] = (map[day] || 0) + m.pnl;
        });
        const days = Object.keys(map).sort();
        return days.map(d => ({ date: d, label: d.slice(5), pnl: Math.round(map[d] * 100) / 100 }));
      }, [trades]);

      // Monthly discipline (rules followed) calculation
      const monthlyDiscipline = useMemo(() => {
        return stats.avgAdh; // Use overall stats which are already calculated
      }, [stats]);



      const winBySetup = useMemo(() => {
        const st = {};
        trades.forEach(t => {
          const arr = t.setup.primary.length ? t.setup.primary : ['Unspecified'];
          arr.forEach(s => {
            if (!st[s]) st[s] = { w: 0, t: 0 };
            st[s].t++;
            if (t.outcome === 'Win' || t.outcome === 'Target hit') st[s].w++;
          });
        });
        return Object.entries(st).map(([label, { w, t }]) => ({ label, value: t ? Math.round((w / t) * 100) : 0, suffix: '%' })).sort((a, b) => b.value - a.value);
      }, [trades]);

      const winBySession = useMemo(() => {
        const st = {};
        SESSIONS.forEach(s => st[s] = { w: 0, t: 0 });
        trades.forEach(t => {
          st[t.session].t++;
          if (t.outcome === 'Win' || t.outcome === 'Target hit') st[t.session].w++;
        });
        return Object.entries(st).filter(([, v]) => v.t > 0).map(([label, { w, t }]) => ({ label, value: Math.round((w / t) * 100), suffix: '%' }));
      }, [trades]);

      const failRate = useMemo(() => {
        if (!trades.length) return [];
        const st = {};
        CHECKLIST_DEF.forEach(x => st[x.k] = { n: 0, t: 0, l: x.l });
        trades.forEach(t => {
          CHECKLIST_DEF.forEach(x => {
            const v = (x.k in (t.executionReview || {})) ? t.executionReview[x.k] : t.checklist[x.k];
            if (v !== 'Skipped' && v !== undefined) {
              st[x.k].t++;
              if (x.k === 'noNews5min' ? v === 'Yes' : v === 'No') st[x.k].n++;
            }
          });
        });
        return Object.values(st).filter(s => s.t > 0).map(s => ({ label: s.l, value: Math.round((s.n / s.t) * 100), suffix: '%' })).sort((a, b) => b.value - a.value);
      }, [trades]);

      const pnlByHour = useMemo(() => {
        const map = {};
        trades.forEach(t => {
          const m = calcMetrics(t);
          const entryTime = t.entries && t.entries.length && t.entries[0].time 
            ? t.entries[0].time 
            : t.date.slice(11, 16);
            
          let hourLabel = 'Other';
          if (entryTime && entryTime.includes(':')) {
            const h = parseInt(entryTime.split(':')[0], 10);
            hourLabel = `${h > 12 ? h - 12 : (h === 0 ? 12 : h)}${h >= 12 ? 'pm' : 'am'}`;
          }
          map[hourLabel] = (map[hourLabel] || 0) + m.pnl;
        });
        
        const order = ['6am', '7am', '8am', '9am', '10am', '11am', '12pm', '1pm', '2pm', '3pm', '4pm', 'Other'];
        return Object.keys(map)
          .map(k => ({ label: k, value: map[k], orderIdx: order.indexOf(k) > -1 ? order.indexOf(k) : 99 }))
          .sort((a, b) => a.orderIdx - b.orderIdx)
          .map(d => ({ label: d.label, value: Math.round(d.value) }));
      }, [trades]);

      const pnlByDayOfWeek = useMemo(() => {
        const map = {};
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        trades.forEach(t => {
          const m = calcMetrics(t);
          const d = new Date(t.date);
          const dayName = days[d.getDay()];
          map[dayName] = (map[dayName] || 0) + m.pnl;
        });
        const order = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
        return order.filter(d => map[d] !== undefined).map(d => ({ label: d, value: Math.round(map[d]) }));
      }, [trades]);


      if (!stats) {
        return e('div', { className: 'max-w-7xl mx-auto px-4 py-20 text-center' },
          e('div', { className: 'max-w-md mx-auto' },
            e('h2', { className: 'text-2xl font-extrabold text-white mb-3 tracking-tight' }, 'Everything you wanted to know about your trading.'),
            e('p', { className: 'text-sm text-gray-500 mb-8 leading-relaxed' }, 'Build your edge through data. Log your first MNQ or MES trade to unlock analytics, streaks, and discipline tracking.'),
            e('p', { className: 'text-[11px] text-gray-600' }, 'Your data stays local in your browser.')
          )
        );
      }

      return e('div', { className: 'max-w-7xl mx-auto px-4 py-6 space-y-6' },
        e('div', { className: 'grid grid-cols-2 md:grid-cols-4 gap-4' },
          e(StatCard, { label: 'Total P&L', value: fmt$(stats.totalPnL), color: stats.totalPnL >= 0 ? 'green' : 'red' }),
          e(StatCard, { label: 'Profit Factor', value: stats.profitFactor, sub: 'Gross Profit / Gross Loss', color: stats.profitFactor >= 1.5 ? 'green' : stats.profitFactor >= 1 ? 'amber' : 'red' }),
          e(StatCard, { label: 'Win Rate', value: `${stats.winRate}%`, sub: `${stats.total} Total Trades`, color: stats.winRate >= 50 ? 'green' : 'red' }),
          e(StatCard, { label: 'Avg R:R', value: `${stats.avgRR}:1`, color: stats.avgRR >= 2.5 ? 'green' : 'amber' })
        ),
        e('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-4' },
          e('div', { className: 'lg:col-span-2' }, e(MonthlyCalendar, { pnlByDay, onDateClick, discipline: stats.avgAdh })),
          e('div', { className: 'flex flex-col gap-4' },
            e(ExpectancyStats, { trades }),
            e(BestWorstDays, { pnlByDay }),
            e(DirectionPieChart, { longs: stats.longs, shorts: stats.shorts, title: 'Direction Edge' })
          )
        ),
        e('div', { className: 'grid grid-cols-2 gap-4' },
          e(StatCard, { label: 'Premium Setups', value: `${stats.aPlusRate}%`, sub: 'A++ grade', color: 'blue' }),
          e(StatCard, { label: 'Rules Followed', value: `${stats.avgAdh}%`, sub: '#1 Metric', color: stats.avgAdh >= 80 ? 'green' : stats.avgAdh >= 50 ? 'amber' : 'red' })
        ),
        e('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-4' },
          e(TimeProfitabilityChart, { hourlyData: pnlByHour, dailyData: pnlByDayOfWeek, setupData: winBySetup }),
          e(ChecklistFailureList, { data: failRate, title: 'Checklist Failure Rate' })
        )
      );
    }

    // ---------- TradeForm ----------
    function TradeForm({ trade, onSave, onCancel }) {
      const [data, setData] = useState(() => trade ? JSON.parse(JSON.stringify(trade)) : emptyTrade());

      const metrics = useMemo(() => {
        const prices = ['stopPrice', 'targetPrice'];
        if (prices.some(k => data[k] === '' || data[k] == null || isNaN(data[k]))) return null;
        return calcMetrics(data);
      }, [data.entryPrice, data.stopPrice, data.targetPrice, data.exitPrice, data.entries, data.exits, data.instrument, data.direction, data.contracts]);

      const adherence = useMemo(() => calcAdherence(data), [data.checklist, data.psychology?.setupPlanLevel]);
      const totalAdherence = adherence;

      const suggested = useMemo(() => {
        const prices = ['stopPrice', 'targetPrice'];
        if (prices.some(k => data[k] === '' || data[k] == null || isNaN(data[k]))) return null;
        return suggestOutcome(data);
      }, [data.entryPrice, data.stopPrice, data.targetPrice, data.exitPrice, data.entries, data.exits, data.direction, data.contracts]);

      const update = (path, val) => {
        setData(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          if (path.includes('.')) {
            const parts = path.split('.');
            let cur = next;
            for (let i = 0; i < parts.length - 1; i++) {
              if (cur[parts[i]] === undefined) cur[parts[i]] = {};
              cur = cur[parts[i]];
            }
            cur[parts[parts.length - 1]] = val;
          } else {
            next[path] = val;
          }
          return next;
        });
      };

      const handleSubmit = ev => {
        ev.preventDefault();
        const required = ['stopPrice', 'targetPrice'];
        if (required.some(k => data[k] === '' || data[k] == null)) {
          alert('Please fill in all required fields including prices.');
          return;
        }
        const payload = JSON.parse(JSON.stringify(data));
        ['stopPrice', 'targetPrice'].forEach(k => {
          payload[k] = parseFloat(payload[k]);
        });
        
        if (!payload.entries || payload.entries.length === 0) {
          payload.entries = [{ time: '', price: parseFloat(payload.entryPrice || 0), contracts: payload.contracts || 1 }];
        } else {
          payload.entries.forEach(en => {
            en.price = parseFloat(en.price);
            en.contracts = parseFloat(en.contracts);
          });
          payload.entryPrice = payload.entries[0].price;
          payload.contracts = payload.entries.reduce((s, x) => s + x.contracts, 0);
        }

        if (!payload.exits || payload.exits.length === 0) {
          payload.exits = [{ price: parseFloat(payload.exitPrice || 0), contracts: payload.contracts }];
        } else {
          payload.exits.forEach(ex => {
            ex.price = parseFloat(ex.price);
            ex.contracts = parseFloat(ex.contracts);
          });
          // Sync legacy exit price just in case
          payload.exitPrice = payload.exits[payload.exits.length - 1].price;
        }
        onSave(payload);
      };

      return e('form', { onSubmit: handleSubmit, className: 'max-w-5xl mx-auto px-4 py-8' },
        e('div', { className: `rounded-2xl p-6 mb-8 text-center border border-white/[0.06] shadow-2xl ${totalAdherence >= 80 ? 'shadow-emerald-900/10 bg-emerald-500/[0.03]' : totalAdherence >= 50 ? 'shadow-amber-900/10 bg-amber-500/[0.03]' : 'shadow-rose-900/10 bg-rose-500/[0.03]'}` },
          e('div', { className: 'text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-2 font-semibold' }, 'Rules Followed Percentage'),
          e('div', { className: 'text-6xl font-extrabold tracking-tighter text-white' }, `${totalAdherence}%`),

                        e('td', { className: `px-5 py-4 font-mono font-bold tracking-tight text-base ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}` }, fmt$(pnl)),
                        e('td', { className: 'px-5 py-4 text-gray-300 font-bold' }, s.trades.length),
                        e('td', { className: 'px-5 py-4' }, e('span', { className: `font-bold ${winRate >= 50 ? 'text-emerald-400' : s.trades.length === 0 ? 'text-gray-500' : 'text-rose-400'}` }, `${winRate}%`)),
                        e('td', { className: 'px-5 py-4' }, e('span', { className: `font-bold ${rScore >= 80 ? 'text-emerald-400' : rScore >= 50 ? 'text-amber-400' : 'text-rose-400'}` }, `${rScore}%`)),
                        e('td', { className: 'px-5 py-4 whitespace-nowrap' },
                          e('button', { onClick: (e) => { e.stopPropagation(); onEditSession(s.id); }, className: 'text-blue-400 hover:text-blue-300 text-xs font-bold px-3 py-1.5 bg-blue-500/10 hover:bg-blue-500/20 rounded-md mr-2 transition' }, 'Edit Routine'),
                          e('button', { onClick: (e) => { e.stopPropagation(); onDeleteSession(s.id); }, className: 'text-rose-400 hover:text-rose-300 text-xs font-bold px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 rounded-md transition' }, 'Del Session')
                        )
                      ),
                      isExp && s.trades.length > 0 && e('tr', { className: 'bg-[#050507]/80' },
                        e('td', { colSpan: 6, className: 'p-0' },
                          e('div', { className: 'px-8 py-4 bg-black/40 shadow-inner border-b border-white/[0.02]' },
                            e('table', { className: 'w-full text-xs' },
                              e('thead', null, e('tr', { className: 'text-gray-500 uppercase tracking-wider font-semibold border-b border-white/[0.04]' },
                                e('th', { className: 'pb-2 text-left px-4' }, 'Session'),
                                e('th', { className: 'pb-2 text-left px-4' }, 'Inst'),
                                e('th', { className: 'pb-2 text-left px-4' }, 'Dir'),
                                e('th', { className: 'pb-2 text-left px-4' }, 'Outcome'),
                                e('th', { className: 'pb-2 text-left px-4' }, 'R:R'),
                                e('th', { className: 'pb-2 text-left px-4' }, 'P&L'),
                                e('th', { className: 'pb-2 text-left px-4' }, 'Actions')
                              )),
                              e('tbody', null,
                                s.trades.map((t, idx) => {
                                  const m = calcMetrics(t);
                                  return e('tr', { key: idx, className: 'border-b border-white/[0.02] hover:bg-white/[0.04] transition cursor-pointer', onClick: () => setViewingTrade({ trade: t, routine: s.routine }) },
                                    e('td', { className: 'py-3 px-4 text-gray-400 text-[10px] font-bold uppercase tracking-wider' }, t.session),
                                    e('td', { className: 'py-3 px-4 font-bold text-gray-300' }, t.instrument),
                                    e('td', { className: 'py-3 px-4' }, e('span', { className: t.direction === 'Long' ? 'text-emerald-400' : 'text-rose-400' }, t.direction)),
                                    e('td', { className: 'py-3 px-4' }, e('span', { className: `px-2 py-0.5 rounded-sm text-[9px] uppercase font-bold tracking-wider border ${t.outcome === 'Win' || t.outcome === 'Target hit' ? 'bg-emerald-900/30 text-emerald-400 border-emerald-500/30' : t.outcome === 'Loss' ? 'bg-rose-900/30 text-rose-400 border-rose-500/30' : 'bg-amber-900/30 text-amber-400 border-amber-500/30'}` }, t.outcome)),
                                    e('td', { className: 'py-3 px-4 font-mono text-gray-400' }, `${m.rr}:1`),
                                    e('td', { className: `py-3 px-4 font-mono font-bold ${m.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}` }, fmt$(m.pnl)),
                                    e('td', { className: 'py-3 px-4 whitespace-nowrap' },
                                      e('button', { onClick: (ev) => { ev.stopPropagation(); onEditTrade(s.id, idx); }, className: 'text-blue-400 hover:text-blue-300 text-[11px] font-bold mr-3' }, 'Edit'),
                                      e('button', { onClick: (ev) => { ev.stopPropagation(); onDeleteTrade(s.id, idx); }, className: 'text-rose-400 hover:text-rose-300 text-[11px] font-bold' }, 'Del')
                                    )
                                  );
                                })
                              )
                            )
                          )
                        )
                      )
                    );
                  })
              )
            )
          )
        ),
        e('div', { className: 'mt-3 px-2 text-[11px] font-bold text-gray-600 uppercase tracking-wider' }, `Showing ${filtered.length} of ${sessions.length} sessions`),
        viewingTrade && e(TradeDetailsModal, { trade: viewingTrade.trade || viewingTrade, routine: viewingTrade.routine, onClose: () => setViewingTrade(null) })
      );
    }

    // ==================== APP ====================
    function Footer() {
      return e('footer', { className: 'border-t border-white/[0.04] bg-[#050507] py-6 mt-12' },
        e('div', { className: 'max-w-7xl mx-auto px-4 text-center' },
          e('p', { className: 'text-[11px] text-gray-600 leading-relaxed max-w-2xl mx-auto' }, 'Futures trading involves substantial risk of loss and is not suitable for all investors. Past performance is not indicative of future results. This journal is for educational and self-analysis purposes only. Always conduct your own due diligence and consult a licensed financial advisor before making trading decisions.')
        )
      );
    }

    function App() {
      const [sessions, setSessions] = useState(() => {
        try {
          const r = localStorage.getItem('tradingSessions_v1');
          if (r) return JSON.parse(r);
          // Migration from v1 trades/routines
          const oldTrades = JSON.parse(localStorage.getItem('tradingJournal_v1') || '[]');
          const oldRoutines = JSON.parse(localStorage.getItem('tradingJournalRoutines_v1') || '[]');
          if (oldTrades.length === 0 && oldRoutines.length === 0) return [];

          const map = {};
          oldTrades.forEach(t => {
            const d = t.date.slice(0, 10);
            if (!map[d]) map[d] = { id: d, date: d, routine: emptyRoutine(), trades: [] };
            map[d].trades.push(t);
          });
          oldRoutines.forEach(r => {
            if (!map[r.date]) map[r.date] = { id: r.date, date: r.date, routine: emptyRoutine(), trades: [] };
            map[r.date].routine = r;
          });
          return Object.values(map).sort((a, b) => b.date.localeCompare(a.date));
        } catch (e) { return []; }
      });

      const [view, setView] = useState('dashboard');
      const [editId, setEditId] = useState(null);
      const [editTradeIdx, setEditTradeIdx] = useState(null);
      const [journalTargetDate, setJournalTargetDate] = useState(null);

      const handleDateClick = (dateStr) => {
        setJournalTargetDate({ date: dateStr, ts: Date.now() });
        setView('journal');
      };

      useEffect(() => { localStorage.setItem('tradingSessions_v1', JSON.stringify(sessions)); }, [sessions]);

      const allTrades = useMemo(() => sessions.flatMap(s => s.trades), [sessions]);

      const handleSaveSession = session => {
        const conflict = sessions.find(s => s.date === session.date && s.id !== session.id);
        if (conflict) {
          alert('A session for this date already exists! Please go to the Journal tab, click "Edit Routine" or "Edit" on that specific date to add/modify trades.');
          return;
        }
        if (!session.id) session.id = Date.now().toString(36);
        setSessions(prev => {
          const filtered = prev.filter(s => s.id !== session.id);
          return [session, ...filtered].sort((a, b) => b.date.localeCompare(a.date));
        });
        setEditId(null);
        setEditTradeIdx(null);
        setView('journal');
      };

      const handleEdit = (id, tIdx = null) => { setEditId(id); setEditTradeIdx(tIdx); setView('log'); };
      const handleDelete = id => { if (window.confirm('Delete this entire session and all its trades?')) setSessions(prev => prev.filter(s => s.id !== id)); };

      const handleDeleteTrade = (sessionId, tIdx) => {
        if (window.confirm('Delete this trade?')) {
          setSessions(prev => prev.map(s => {
            if (s.id === sessionId) {
              const next = { ...s, trades: [...s.trades] };
              next.trades.splice(tIdx, 1);
              return next;
            }
            return s;
          }));
        }
      };

      const handleNew = () => { setEditId(null); setEditTradeIdx(null); setView('log'); };

      const navBtn = (label, key, extra = '') => e('button', { onClick: () => setView(key), className: `px-4 py-2 rounded-lg text-[11px] uppercase tracking-wider font-bold transition border border-transparent ${view === key ? 'bg-blue-600/90 text-white shadow-lg shadow-blue-900/20' : 'text-gray-400 hover:text-white hover:bg-white/[0.04] hover:border-white/[0.06]'} ${extra}` }, label);

      return e('div', { className: 'min-h-screen bg-[#050507] text-gray-100 flex flex-col' },
        e('nav', { className: 'glass border-b border-white/[0.04] sticky top-0 z-50' },
          e('div', { className: 'max-w-7xl mx-auto px-4 py-4 flex items-center justify-between' },
            e('div', { className: 'flex items-center gap-3' },
              e('h1', { className: 'text-lg font-extrabold tracking-tight text-white' }, 'Trading Journal'),
              e('span', { className: 'text-[10px] text-emerald-400 font-bold uppercase tracking-widest hidden sm:inline border border-emerald-500/20 bg-emerald-500/10 px-2 py-1 rounded-md' }, 'MNQ / MES')
            ),
            e('div', { className: 'flex items-center gap-2' },
              navBtn('Dashboard', 'dashboard'),
              navBtn('Journal', 'journal'),
              e('button', { onClick: handleNew, className: 'px-4 py-2 rounded-lg text-[11px] uppercase tracking-wider font-extrabold bg-emerald-500 text-black hover:bg-emerald-400 transition shadow-lg shadow-emerald-900/20 ml-2' }, 'Log Session')
            )
          )
        ),
        e('main', { className: 'flex-1' },
          view === 'dashboard' && e(Dashboard, { trades: allTrades, onDateClick: handleDateClick }),
          view === 'log' && e(DailySessionForm, { session: editId ? sessions.find(s => s.id === editId) : null, initialTradeIdx: editTradeIdx, onSave: handleSaveSession, onCancel: () => setView('journal') }),
          view === 'journal' && e(Journal, { sessions, onEditSession: handleEdit, onDeleteSession: handleDelete, onEditTrade: handleEdit, onDeleteTrade: handleDeleteTrade, targetDate: journalTargetDate })
        ),
        e(Footer)
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>

</html>
